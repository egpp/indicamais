name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  opennext-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
      # Valida o bundle do Worker sem publicar (--dry-run): o deploy dev de 07/11/2026 falhou na Cloudflare
      # (erro 10021, __dirname) por causa de next/server no caminho do `scheduled`. Aqui falha antes.
      - run: pnpm wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-bundle"
      - name: Bundle do Worker sem ua-parser-js do Next
        run: |
          if grep -rq "next/dist/compiled/ua-parser-js" "$RUNNER_TEMP/wrangler-bundle"; then
            echo "O bundle da entrada puxa next/server (ua-parser-js usa __dirname)." >&2
            exit 1
          fi
