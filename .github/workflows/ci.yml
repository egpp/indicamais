name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  opennext-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
      # Carrega o Worker de verdade no workerd (wrangler dev local, sem publicar): o deploy dev de 07/11/2026
      # falhou na Cloudflare (erro 10021, __dirname) por causa de next/server no caminho do `scheduled`.
      # O erro de escopo global aparece ao carregar o script, antes de qualquer requisicao.
      - name: Worker carrega no workerd sem erro de escopo global
        run: |
          pnpm wrangler dev --local --port 8787 > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          WPID=$!
          for i in $(seq 1 60); do
            grep -q "Ready on" "$RUNNER_TEMP/wrangler-dev.log" && break
            sleep 1
          done
          curl -s -o /dev/null --max-time 20 http://localhost:8787/ || true
          sleep 3
          kill $WPID 2>/dev/null || true
          cat "$RUNNER_TEMP/wrangler-dev.log"
          grep -q "Ready on" "$RUNNER_TEMP/wrangler-dev.log"
          ! grep -q "__dirname is not defined" "$RUNNER_TEMP/wrangler-dev.log"
