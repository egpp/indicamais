name: Deploy dev

# Publica SOMENTE o Worker de desenvolvimento (indicamais-dev). D-003, IM-085.
# Disparo manual: GitHub > Actions > Deploy dev > Run workflow.
# Este workflow nao tem nenhum passo de producao.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Garantir que o alvo e o Worker de dev
        run: |
          set -eu
          if ! grep -Eq '"name"[[:space:]]*:[[:space:]]*"indicamais-dev"' wrangler.jsonc; then
            echo "wrangler.jsonc nao aponta para indicamais-dev. Abortando." >&2
            exit 1
          fi
          if grep -Eq '"(name|service)"[[:space:]]*:[[:space:]]*"indicamais"' wrangler.jsonc; then
            echo "Referencia ao Worker de producao encontrada. Abortando." >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Verificar credenciais da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          faltando=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN. Crie em Settings > Secrets and variables > Actions > Repository secrets."
            faltando=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Falta o secret CLOUDFLARE_ACCOUNT_ID. Crie em Settings > Secrets and variables > Actions > Repository secrets."
            faltando=1
          fi
          if [ "$faltando" -ne 0 ]; then
            exit 1
          fi
          echo "Credenciais da Cloudflare presentes (valores nao exibidos)."

      - name: Publicar em desenvolvimento (indicamais-dev)
        id: publicar
        env:
          # Variavel de repositorio (nao secret): embutida no build do Next. Vazia = omitida.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Sem pipe: a saida vai para arquivo e o status do comando e preservado.
          status=0
          pnpm deploy:dev > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/deploy.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::pnpm deploy:dev falhou com codigo $status."
            exit "$status"
          fi

      - name: URL publicada
        if: ${{ success() && steps.publicar.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          padrao='https://[A-Za-z0-9.-]+\.workers\.dev'
          if ! url=$(grep -Eo "$padrao" "$RUNNER_TEMP/deploy.log" | tail -n 1) || [ -z "$url" ]; then
            echo "::error::Nenhuma URL workers.dev encontrada na saida do deploy."
            echo "Procurado (regex ERE): $padrao"
            echo "Arquivo: $RUNNER_TEMP/deploy.log. Ultimas 30 linhas:"
            tail -n 30 "$RUNNER_TEMP/deploy.log"
            exit 1
          fi
          echo "URL publicada: $url"
          echo "URL publicada: $url" >> "$GITHUB_STEP_SUMMARY"
