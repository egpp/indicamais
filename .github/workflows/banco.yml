name: Banco (pgTAP)

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/banco.yml"]
  push:
    paths: ["supabase/**", ".github/workflows/banco.yml"]

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Banco local descartável no runner (Docker). Não usa secrets nem toca em dev/produção.
      - run: pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - run: pnpm supabase test db
      - if: always()
        run: pnpm supabase stop --no-backup
